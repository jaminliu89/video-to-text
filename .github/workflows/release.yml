name: Release

# 打 tag（v0.5.2）就自动出可分发的包并建 Release；
# 也可以手动跑：Actions → Release → Run workflow
#
# 产物：
#   - 源码包（tar.gz / zip / SHA256SUMS）        ← ubuntu 上构建，秒出
#   - macOS 安装包 VideoToText-<ver>-<arch>.dmg  ← macos-14 上 PyInstaller + hdiutil
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v），留空则用 VERSION 文件"
        required: false

permissions:
  contents: write

jobs:
  # ---------- 1. 源码包 + 建 Release ----------
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Smoke test before shipping
        run: |
          pip install -r requirements.txt
          python -m py_compile cli.py v2t/asr.py v2t/distill.py
          python tests/test_distill_units.py
          python tests/test_asr_units.py
          python cli.py engines

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(cat VERSION)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V"

      - name: Build source distribution
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x scripts/build_release.sh
          bash scripts/build_release.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装（macOS 桌面版）

            下载 `VideoToText-${{ steps.ver.outputs.version }}-arm64.dmg`，双击挂载，
            把 App 拖进 Applications。**首次打开请右键 → 打开**（ad-hoc 签名，未走苹果公证）。

            ```bash
            xattr -dr com.apple.quarantine /Applications/VideoToText.app   # 提示"已损坏"时执行
            ```

            已内置 ffmpeg / ffprobe，转写默认 faster-whisper（首次使用自动下载模型）。

            ## 安装（源码 / 命令行）

            ```bash
            tar -xzf video2text-${{ steps.ver.outputs.version }}.tar.gz
            cd video2text-${{ steps.ver.outputs.version }}
            pip install -r requirements.txt
            brew install ffmpeg            # macOS；Linux 用 apt install ffmpeg
            python cli.py engines          # 看哪些转写引擎可用
            ```

            ## 校验

            ```bash
            shasum -a 256 -c SHA256SUMS.txt
            ```

            转写引擎对比见 `docs/asr-engines.md`，蒸馏方法见 `docs/distill-method.md`。
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Keep source artifact
        uses: actions/upload-artifact@v4
        with:
          name: video2text-src-v${{ steps.ver.outputs.version }}
          path: dist/
          retention-days: 90

  # ---------- 2. macOS DMG ----------
  dmg:
    runs-on: macos-14   # arm64
    needs: source
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # App 只用 faster-whisper，不装 torch/transformers/mlx（spec 里也排除了）
          pip install -r requirements.txt pyinstaller

      - name: Build .app + DMG
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          chmod +x scripts/build_dmg.sh
          bash scripts/build_dmg.sh

      - name: Verify DMG
        run: |
          set -euo pipefail
          DMG="$(ls dist/*.dmg | head -1)"
          echo "DMG: $DMG ($(du -h "$DMG" | cut -f1))"
          MP="$(mktemp -d)"
          hdiutil attach "$DMG" -mountpoint "$MP" -nobrowse -quiet
          test -d "$MP/VideoToText.app" || { echo "✗ DMG 里没有 App"; exit 1; }
          test -L "$MP/Applications" || { echo "✗ 缺少 Applications 软链"; exit 1; }
          test -x "$MP/VideoToText.app/Contents/MacOS/VideoToText" || { echo "✗ 主程序不可执行"; exit 1; }
          # 源码不在磁盘上（打进 PYZ 了），改用这些标志物确认打包完整
          test -f "$MP/VideoToText.app/Contents/Frameworks/base_library.zip" \
            || { echo "✗ 缺 base_library.zip，打包不完整"; exit 1; }
          test -f "$MP/VideoToText.app/Contents/Resources/VERSION" \
            || { echo "✗ 缺 VERSION"; exit 1; }
          echo "App 内版本：$(cat "$MP/VideoToText.app/Contents/Resources/VERSION")"
          BIN="$(find "$MP/VideoToText.app/Contents" -name ffmpeg -type f | head -1)"
          test -n "$BIN" || { echo "✗ App 里没有 ffmpeg"; exit 1; }
          "$BIN" -version | head -1
          # 必须是静态链接：动态链接到 /opt/homebrew 的包换台机器就废了
          if otool -L "$BIN" | grep -q "/opt/homebrew\|/usr/local/opt"; then
            echo "✗ ffmpeg 是动态链接的，不能分发"; otool -L "$BIN"; exit 1
          fi
          du -sh "$MP/VideoToText.app"
          hdiutil detach "$MP" -quiet

      - name: Smoke test App（真的启动一次）
        run: |
          set -euo pipefail
          APP="dist/VideoToText.app"
          # launcher 会把 stdout/stderr 重定向到 ~/Library/.../app.log（窗口模式没终端），
          # 所以这里的 /tmp/app.log 只兜底 PyInstaller bootloader 自己的输出
          V2T_SHOW=0 "$APP/Contents/MacOS/VideoToText" > /tmp/boot.log 2>&1 &
          PID=$!
          LOG="$HOME/Library/Application Support/VideoToText/app.log"
          ok=0
          for i in $(seq 1 60); do
            code="$(curl -s -o /tmp/page.html -w '%{http_code}' http://127.0.0.1:8766/ || true)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done

          # 回归测试：曾经因为没调 multiprocessing.freeze_support()，每个 tracker 子进程
          # 都会把整个 App 再启动一遍，几十个进程无限复制、互相抢端口。
          N="$(pgrep -f "VideoToText.app/Contents/MacOS" | wc -l | tr -d ' ')"
          echo "进程数：$N"

          if [ "$ok" != "1" ]; then
            echo "✗ App 起不来（HTTP=${code:-none}）"
            echo "--- boot.log ---"; tail -40 /tmp/boot.log
            echo "--- app.log ---"; tail -60 "$LOG" 2>/dev/null || echo "(没有 app.log)"
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          grep -q "蒸馏" /tmp/page.html || { echo "✗ 首页内容不对"; head -20 /tmp/page.html; kill "$PID" 2>/dev/null || true; exit 1; }

          # 正常是 2 个：主进程 + multiprocessing 的 resource_tracker。
          # 曾经的 bug 会涨到几十上百个，所以 5 作为上限足够宽松又能抓住回归。
          if [ "$N" -gt 5 ]; then
            echo "✗ 进程数异常（$N），疑似 multiprocessing 子进程把 App 又启动了一遍"
            tail -40 "$LOG" 2>/dev/null || true
            kill "$PID" 2>/dev/null || true
            exit 1
          fi

          echo "--- app.log ---"; cat "$LOG" 2>/dev/null || true
          kill "$PID" 2>/dev/null || true
          echo "✓ App 启动正常，首页可访问（含第三模式），进程数 $N"

      - name: Upload DMG to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG="$(ls dist/*.dmg | head -1)"
          shasum -a 256 "$DMG" | awk -v n="$(basename "$DMG")" '{print $1"  "n}' > dist/DMG-SHA256.txt
          gh release upload "v${{ needs.source.outputs.version }}" "$DMG" dist/DMG-SHA256.txt --clobber

      - name: Keep DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: video2text-dmg-v${{ needs.source.outputs.version }}
          path: dist/*.dmg
          retention-days: 90
